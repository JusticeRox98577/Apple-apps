name: OceanABRP
options:
  bundleIdPrefix: com.justice
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: L2TJW2J666
    MARKETING_VERSION: "1.3"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  OceanABRP:
    type: application
    platform: iOS
    sources:
      - OceanABRP
    info:
      path: OceanABRP/Info.plist
      properties:
        CFBundleDisplayName: Ocean Live
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - bluetooth-central
          - location
        NSBluetoothAlwaysUsageDescription: Ocean Live connects to your Bluetooth OBD adapter to read your car's battery data.
        NSLocationWhenInUseUsageDescription: Ocean Live sends your position to A Better Route Planner along with your car data.
        NSLocationAlwaysAndWhenInUseUsageDescription: Ocean Live keeps sending your position to A Better Route Planner while the screen is off.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.justice.OceanABRP
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
